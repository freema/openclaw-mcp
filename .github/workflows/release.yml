name: Release

on:
  push:
    tags:
      - '[0-9]*'

permissions:
  contents: write
  packages: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Test
        run: npm run test:run

      - name: Build
        run: npm run build

      - name: Create archive
        run: tar -czf openclaw-mcp-${{ github.ref_name }}.tar.gz dist package.json README.md LICENSE

      # Docker image build & push to GHCR
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: |
          echo "VERSION=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          # Prereleases (2.0.0-beta.1) must not move the `latest` tag that
          # production deployments pull.
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            echo "PRERELEASE=true" >> $GITHUB_OUTPUT
            echo "DOCKER_TAGS=ghcr.io/freema/openclaw-mcp:${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          else
            echo "PRERELEASE=false" >> $GITHUB_OUTPUT
            printf 'DOCKER_TAGS<<EOF\nghcr.io/freema/openclaw-mcp:latest\nghcr.io/freema/openclaw-mcp:%s\nEOF\n' "${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          fi

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.version.outputs.DOCKER_TAGS }}
          build-args: |
            VERSION=${{ steps.version.outputs.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: openclaw-mcp-${{ github.ref_name }}.tar.gz
          generate_release_notes: true
          prerelease: ${{ steps.version.outputs.PRERELEASE == 'true' }}
          body: |
            ## Docker image

            ```bash
            docker pull ghcr.io/freema/openclaw-mcp:${{ steps.version.outputs.VERSION }}
            ```

            See [deployment docs](https://github.com/freema/openclaw-mcp/blob/main/docs/deployment.md) for full setup instructions.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger npm publish
        run: gh workflow run publish.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The registry lists a single current version per server, so a
      # prerelease must not replace the stable entry.
      - name: Trigger MCP Registry publish
        if: steps.version.outputs.PRERELEASE != 'true'
        run: gh workflow run publish-mcp-registry.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
