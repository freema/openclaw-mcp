name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Use Node.js 24.x
        uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org/'
          cache: 'npm'

      # Trusted publishing needs npm >= 11.5.1, which ships with Node 24.
      # No NPM_TOKEN: the publish authenticates over GitHub OIDC, and npm
      # attaches the provenance attestation on its own.
      - name: Verify npm supports trusted publishing
        run: |
          NPM_VERSION=$(npm --version)
          echo "npm $NPM_VERSION"
          REQUIRED=11.5.1
          if [ "$(printf '%s\n' "$REQUIRED" "$NPM_VERSION" | sort -V | head -1)" != "$REQUIRED" ]; then
            echo "npm >= $REQUIRED required for trusted publishing, got $NPM_VERSION" >&2
            exit 1
          fi

      # A run dispatched against a release tag must publish exactly that
      # version; anything else means the tag and package.json disagree.
      - name: Verify the tag matches package.json
        if: github.ref_type == 'tag'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $VERSION" >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: |
          npm run typecheck
          npm run lint
          npm run format:check
          npm run test:run
          npm run build

      - name: Publish
        run: |
          # Prereleases go under the `beta` dist-tag so `npm i openclaw-mcp`
          # keeps resolving to the latest stable release.
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$VERSION" == *-* ]]; then
            npm publish --access public --tag beta
          else
            npm publish --access public
          fi
